name: Refresh APEX Edge data

on:
  # No `schedule:` trigger on purpose — this used to run every 30 minutes automatically, which was the main
  # driver of a real cost/usage problem (see README's "Manual-only refresh" section for the full history).
  # Refreshes are manual-only now: either "Run workflow" here, or the site's "Refresh Now" button (which fires
  # this same workflow_dispatch via netlify/functions/trigger-refresh.js) — nothing runs on its own anymore.
  # Re-adding a `schedule:` block here is how a future auto-refresh would come back if that tradeoff changes.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The full pipeline (odds, nflverse + play-by-play, weather) is data-fetch-bound, not compute-bound — 25
    # minutes is a safety margin, not the expected runtime; a normal refresh finishes well under this.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node scripts/refresh.js
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
